<main class="page">
  <section aria-labelledby="table-h">
    <h2 id="table-h">Tous les liens</h2>
    <div class="filters">
      <select aria-label="Filtrer par catégorie" [value]="categoryFilter()" (change)="categoryOverride.set(val($event))">
        <option value="">Toutes les catégories</option>
        @for (c of categories(); track c.category) {
          <option [value]="c.category" [selected]="categoryFilter() === c.category">{{ c.category }} ({{ c.count }})</option>
        }
        <option value="_" [selected]="categoryFilter() === '_'">{{ uncategorized }}</option>
      </select>
    </div>
    <app-links-table [links]="rows()" />
  </section>
</main>
