# mes-liens — production (VPS). NE CONTIENT AUCUN SECRET : tout vient de .env.prod (créé sur le serveur, jamais commité).
# Trois conteneurs, indépendants des autres applications du serveur.
name: mes-liens

services:
  db:
    image: postgres:18-alpine
    container_name: mesliens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesliens
      POSTGRES_USER: mesliens
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18+ : le dossier de données est versionné sous ce point de montage
    networks: [internal] # réseau privé : aucun accès depuis Caddy ni depuis les autres applications ; aucun port publié
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesliens -d mesliens"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  api:
    build: ./api
    container_name: mesliens-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://mesliens-db:5432/mesliens
      DB_USER: mesliens
      DB_PASSWORD: ${DB_PASSWORD:?}
      MESLIENS_TOKEN: ${MESLIENS_TOKEN:?MESLIENS_TOKEN manquant dans .env.prod}
      MESLIENS_REQUIRE_HTTPS: "true"
      # Sûr ici : Caddy réécrit X-Forwarded-For / X-Forwarded-Proto (un client ne peut pas les forger).
      MESLIENS_TRUST_XFF: "true"
      MESLIENS_SCREENSHOTS_DIR: /data/screenshots
      # Même origine (PWA et API sur le même domaine) : pas de CORS.
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+ExitOnOutOfMemoryError"
    volumes:
      - screenshots:/data/screenshots
    networks: [internal, web] # internal : vers la base ; web : pour que Caddy joigne l'API
    mem_limit: 400m

  previews:
    image: mesliens-previews:learning-v1
    container_name: mesliens-previews
    restart: unless-stopped
    init: true
    depends_on: [api]
    environment:
      API_URL: http://mesliens-api:8080
      MESLIENS_TOKEN: ${MESLIENS_TOKEN:?}
      CHECK_INTERVAL_MS: "45000"
      BLOCKED_IPS: ${MESLIENS_BLOCKED_IPS:-}
    networks: [web]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777
      - /home/node/.cache:size=32m,uid=1000,gid=1000

  # Connexion Google. Démarré seulement avec « --profile auth » ET quand ~/mes-liens/.env.auth existe (infra/auth-setup.sh) :
  # sans identifiants il ne pourrait pas démarrer, et il ne doit pas empêcher le reste de monter.
  oauth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: mesliens-oauth
    profiles: [auth]
    restart: unless-stopped
    env_file: .env.auth # OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET (jamais dans le dépôt)
    command:
      - --provider=google
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true # fait confiance aux en-têtes X-Forwarded-* posés par Caddy (seul Caddy peut joindre ce conteneur)
      - --redirect-url=https://links.sn8w.com/oauth2/callback
      - --upstream=static://202 # mode « portier » : pas de proxy, seulement la décision connecté / non connecté
      - --authenticated-emails-file=/etc/oauth2/emails.txt # SEULES ces adresses entrent, même avec un compte Google valide
      - --whitelist-domain=links.sn8w.com
      - --skip-provider-button=true # va directement chez Google
      - --code-challenge-method=S256 # PKCE
      - --approval-prompt=auto # Google ne redemande pas l'accord à chaque connexion (la valeur par défaut est « force »)
      - --cookie-name=__Host-mesliens # préfixe __Host- : cookie Secure, sans Domain, Path=/
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=168h # reconnexion tous les 7 jours
      - --cookie-refresh=1h # revérifie chaque heure que le compte est toujours autorisé
    volumes:
      - ./auth/emails.txt:/etc/oauth2/emails.txt:ro
    networks: [web] # Caddy la joint par ce réseau ; elle a besoin d'Internet pour parler à Google
    mem_limit: 64m

  web:
    image: caddy:2-alpine # même image que le proxy du serveur (déjà présente, rien à télécharger)
    container_name: mesliens-web
    restart: unless-stopped
    volumes:
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv:ro
    networks: [web]
    mem_limit: 64m

networks:
  internal:
    internal: true
  web:
    external: true # réseau partagé existant, utilisé par le Caddy du serveur

volumes:
  pgdata:
  screenshots:
