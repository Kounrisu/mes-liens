spring.application.name=mes-liens-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mesliens}
spring.datasource.username=${DB_USER:mesliens}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Jeton unique (32 octets aléatoires, hex ou base64). OBLIGATOIRE : l'application refuse de démarrer sans.
mesliens.token=${MESLIENS_TOKEN:}
# Derrière le reverse proxy TLS : refuse les requêtes qui ne sont pas arrivées en HTTPS.
mesliens.require-https=${MESLIENS_REQUIRE_HTTPS:true}
# À activer UNIQUEMENT derrière un proxy qui écrase X-Forwarded-For (sinon le limiteur est contournable).
mesliens.trust-forwarded-for=${MESLIENS_TRUST_XFF:false}
mesliens.rate-limit.per-minute=${MESLIENS_RATE_PER_MIN:120}
mesliens.rate-limit.failed-auth-per-minute=${MESLIENS_RATE_FAILED_PER_MIN:10}
mesliens.screenshots.dir=${MESLIENS_SCREENSHOTS_DIR:./data/screenshots}
mesliens.screenshots.max-bytes=${MESLIENS_SCREENSHOT_MAX_BYTES:5242880}

spring.servlet.multipart.enabled=false
server.tomcat.max-swallow-size=6MB

# Origines autorisées (séparées par des virgules). Vide = pas de CORS (même origine). Ex. dev : http://localhost:4300
mesliens.cors-allowed-origins=${MESLIENS_CORS_ORIGINS:}
